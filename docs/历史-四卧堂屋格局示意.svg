<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="980" viewBox="0 0 1380 980">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5b6475; }
      .room-title { font-size: 21px; font-weight: 700; text-anchor: middle;
        paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .room-note { font-size: 13px; fill: #4b5565; text-anchor: middle;
        paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .wall { stroke: #172033; stroke-width: 10; fill: none; stroke-linejoin: round; }
      .partition { stroke: #384152; stroke-width: 5; fill: none; }
      .feature { stroke: #384152; stroke-width: 8; fill: none; stroke-linecap: round; }
      .soft { stroke: #8b93a4; stroke-width: 3; stroke-dasharray: 10 8; fill: none; }
      .furni { fill: #d8b68b; opacity: 0.85; }
      .window { stroke: #2d9cdb; stroke-width: 9; stroke-linecap: round; }
      .door { stroke: #e15f41; stroke-width: 5; fill: none; }
      .dim { stroke: #788195; stroke-width: 2; fill: none; }
      .dim-text { font-size: 15px; fill: #687184; text-anchor: middle; }
      .outside { font-size: 15px; fill: #51606f; }
      .legend { font-size: 14px; fill: #465162; }
      .furni-label { font-size: 12px; fill: #6b5a42; text-anchor: middle; }
      .glass { stroke: #4d9fd0; stroke-width: 5; stroke-linecap: round; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#596579"/>
    </marker>
  </defs>

  <rect width="1380" height="980" fill="#f8fafc"/>
  <text x="60" y="55" class="title">历史存档｜四卧堂屋格局（卧室不等大）</text>
  <text x="60" y="84" class="subtitle">概念平面｜上西、右北、下东、左南｜约 11.00m × 11.058m＝121.64㎡｜非施工图</text>

  <!-- 房间底色 -->
  <rect x="220" y="130" width="210" height="216" fill="#e8f0fe"/>
  <rect x="430" y="130" width="210" height="216" fill="#e8f0fe"/>
  <rect x="640" y="130" width="240" height="216" fill="#ffe6d9"/>

  <rect x="220" y="346" width="141.6" height="72" fill="#c3e3f5"/>
  <rect x="220" y="418" width="141.6" height="84" fill="#eef7f6"/>
  <rect x="361.6" y="346" width="68.4" height="156" fill="#f1f3f6"/>
  <rect x="220" y="502" width="210" height="292" fill="#e8f0fe"/>

  <!-- 堂屋：原过厅＋茶座＋玄关合并为一个空间 -->
  <rect x="430" y="346" width="210" height="448" fill="#f4eadc"/>
  <!-- 客餐一体厅 -->
  <rect x="640" y="346" width="240" height="259" fill="#ffe9c7"/>
  <!-- 卧室 3：从公共区东北角掏出 -->
  <rect x="640" y="605" width="240" height="189" fill="#e8f0fe"/>

  <!-- 外墙 -->
  <rect x="220" y="130" width="660" height="664" class="wall"/>

  <!-- 内隔墙（缺口即门洞） -->
  <path d="M220 346 H368.8 M422.8 346 H437.2 M491.2 346 H647.2 M701.2 346 H880" class="partition"/>
  <path d="M430 130 V346 M640 130 V346" class="partition"/>
  <path d="M361.6 346 V446.8 M361.6 494.8 V502" class="partition"/>
  <path d="M220 502 H368.8 M422.8 502 H430" class="partition"/>
  <path d="M430 502 V794" class="partition"/>

  <!-- 卧室 2 的两堵内墙：南墙对堂屋（取代原客厅墙）、西墙对客餐厅（留 0.9m 门洞）；与其余内隔墙同线宽，门垛才一致 -->
  <path d="M640 605 V794" class="partition"/>
  <path d="M640 605 H647.2 M701.2 605 H880" class="partition"/>

  <!-- 开放区软分界：堂屋与客餐一体厅之间 4.32m 全敞口 -->
  <path d="M640 346 V605" class="soft"/>

  <!-- 短廊门：卧室1、卧室2；卫生间门在东墙脚，均向房间内开 -->
  <path d="M368.8 346 H422.8" stroke="#e8f0fe" stroke-width="12"/>
  <path d="M422.8 346 V292 A54 54 0 0 0 368.8 346" class="door"/>
  <path d="M361.6 446.8 V494.8" stroke="#eef7f6" stroke-width="12"/>
  <path d="M361.6 494.8 H313.6 A48 48 0 0 1 361.6 446.8" class="door"/>
  <path d="M368.8 502 H422.8" stroke="#e8f0fe" stroke-width="12"/>
  <path d="M422.8 502 V556 A54 54 0 0 1 368.8 502" class="door"/>

  <!-- 卧室 4 门：南墙靠西端，与卧室 3 门并排开向堂屋西段；厨房门位于南墙脚开向客餐厅 -->
  <path d="M437.2 346 H491.2" stroke="#e8f0fe" stroke-width="12"/>
  <path d="M437.2 346 V292 A54 54 0 0 1 491.2 346" class="door"/>
  <path d="M647.2 346 H701.2" stroke="#ffe6d9" stroke-width="12"/>
  <path d="M647.2 346 V292 A54 54 0 0 1 701.2 346" class="door"/>

  <!-- 卧室 3 门：开向客餐一体厅，向房间内开 -->
  <path d="M647.2 605 H701.2" stroke="#e8f0fe" stroke-width="12"/>
  <path d="M647.2 605 V659 A54 54 0 0 0 701.2 605" class="door"/>

  <!-- 东墙中部正门（1.8m 双开）与东墙角厨房后门 -->
  <path d="M481 794 H589" stroke="#f8fafc" stroke-width="14"/>
  <path d="M481 794 V740 A54 54 0 0 1 535 794" class="door"/>
  <path d="M589 794 V740 A54 54 0 0 0 535 794" class="door"/>
  <text x="535" y="816" class="outside" text-anchor="middle">东墙中部正门 1.8m 双开</text>
  <path d="M880 284.8 V338.8" stroke="#f8fafc" stroke-width="14"/>
  <path d="M880 338.8 H826 A54 54 0 0 1 880 284.8" class="door"/>
  <text x="913" y="352" class="outside">东墙角厨房后门</text>

  <!-- 外窗：按对应房间墙段中部布置；每个房间同墙一扇 -->
  <path d="M220 193 V283 M220 399 V449 M220 603 V693" class="window"/>
  <path d="M280 130 H370 M480 130 H590 M700 130 H820" class="window"/>
  <path d="M880 208 V268 M880 405 V545 M880 655 V745" class="window"/>
  <path d="M280 794 H370 M715 794 H805" class="window"/>

  <!-- 客餐一体厅家具：六人餐桌居中，电视柜在卧室 2 西墙正中、与餐桌对齐 -->
  <rect x="715" y="448.5" width="90" height="54" rx="6" class="furni"/>
  <text x="760" y="480" class="furni-label">六人餐桌</text>
  <rect x="728" y="430" width="20" height="16" rx="3" fill="#c9a877"/>
  <rect x="772" y="430" width="20" height="16" rx="3" fill="#c9a877"/>
  <rect x="728" y="505" width="20" height="16" rx="3" fill="#c9a877"/>
  <rect x="772" y="505" width="20" height="16" rx="3" fill="#c9a877"/>
  <rect x="695" y="465" width="16" height="20" rx="3" fill="#c9a877"/>
  <rect x="809" y="465" width="16" height="20" rx="3" fill="#c9a877"/>
  <rect x="715" y="569" width="90" height="36" rx="3" class="furni"/>
  <rect x="721" y="575" width="78" height="24" rx="2" fill="#f6ece0"/>
  <text x="760" y="591" class="furni-label">电视柜 1.5m</text>

  <!-- 堂屋南墙通长柜：只做在主卧背墙这 4.87m 实墙段，西段 2.6m 是短廊开口，不能做柜 -->
  <rect x="434" y="504" width="36" height="282" rx="3" class="furni"/>
  <rect x="440" y="510" width="24" height="270" rx="2" fill="#f6ece0"/>
  <text x="452" y="649" class="furni-label" transform="rotate(-90 452 649)">通长柜 4.87m</text>

  <!-- 四张 1.5×2.0m 床：卧室 1／2 床头靠西墙，卧室 3／4 床头靠北墙 -->
  <rect x="265" y="502" width="90" height="120" rx="5" fill="#f6ece0" stroke="#c9a877" stroke-width="2"/>
  <rect x="265" y="502" width="90" height="10" rx="3" class="furni"/>
  <rect x="272" y="516" width="34" height="16" rx="4" fill="#e8dcc8"/>
  <rect x="314" y="516" width="34" height="16" rx="4" fill="#e8dcc8"/>

  <rect x="715" y="605" width="90" height="120" rx="5" fill="#f6ece0" stroke="#c9a877" stroke-width="2"/>
  <rect x="715" y="605" width="90" height="10" rx="3" class="furni"/>
  <rect x="722" y="619" width="34" height="16" rx="4" fill="#e8dcc8"/>
  <rect x="764" y="619" width="34" height="16" rx="4" fill="#e8dcc8"/>

  <rect x="310" y="170" width="120" height="90" rx="5" fill="#f6ece0" stroke="#c9a877" stroke-width="2"/>
  <rect x="420" y="170" width="10" height="90" rx="3" class="furni"/>
  <rect x="400" y="177" width="16" height="34" rx="4" fill="#e8dcc8"/>
  <rect x="400" y="219" width="16" height="34" rx="4" fill="#e8dcc8"/>

  <rect x="520" y="170" width="120" height="90" rx="5" fill="#f6ece0" stroke="#c9a877" stroke-width="2"/>
  <rect x="630" y="170" width="10" height="90" rx="3" class="furni"/>
  <rect x="610" y="177" width="16" height="34" rx="4" fill="#e8dcc8"/>
  <rect x="610" y="219" width="16" height="34" rx="4" fill="#e8dcc8"/>

  <!-- 四组 0.6m 深衣柜：卧室 1 靠北侧背墙、卧室 2 靠南墙、卧室 3／4 靠东墙；均避开门扇开启范围 -->
  <rect x="394" y="565" width="36" height="221" rx="3" class="furni"/>
  <rect x="400" y="572" width="24" height="207" rx="2" fill="#f6ece0"/>
  <text x="412" y="676" class="furni-label" transform="rotate(-90 412 676)">整墙衣柜 3.7m</text>

  <rect x="640" y="665" width="36" height="121" rx="3" class="furni"/>
  <rect x="646" y="672" width="24" height="107" rx="2" fill="#f6ece0"/>
  <text x="658" y="726" class="furni-label" transform="rotate(-90 658 726)">衣柜 2.0m</text>

  <rect x="226" y="310" width="136" height="36" rx="3" class="furni"/>
  <rect x="233" y="316" width="122" height="24" rx="2" fill="#f6ece0"/>
  <text x="294" y="332" class="furni-label">衣柜 2.3m</text>

  <rect x="500" y="310" width="134" height="36" rx="3" class="furni"/>
  <rect x="507" y="316" width="120" height="24" rx="2" fill="#f6ece0"/>
  <text x="567" y="332" class="furni-label">衣柜 2.2m</text>

  <!-- 卫生间干湿分离：西侧 1.2m 湿区（淋浴＋蹲便）整带染色，东侧 1.4m 干区（洗手盆＋洗衣机），中间玻璃隔断留 0.93m 过人口 -->
  <path d="M220 418 H306" class="glass"/>
  <text x="290.8" y="386" class="furni-label">湿区 1.2m</text>
  <text x="290.8" y="496" class="furni-label">干区 1.4m</text>

  <!-- 房间标签 -->
  <text x="325" y="228" class="room-title">卧室 3</text>
  <text x="325" y="255" class="room-note">3.5×3.6＝12.6㎡</text>
  <text x="325" y="278" class="room-note">南窗＋西窗｜双面采光</text>

  <text x="535" y="228" class="room-title">卧室 4</text>
  <text x="535" y="255" class="room-note">3.5×3.6＝12.6㎡</text>
  <text x="535" y="278" class="room-note">西窗</text>

  <text x="760" y="228" class="room-title">柴火厨房</text>
  <text x="760" y="255" class="room-note">4.0×3.6＝14.4㎡</text>
  <text x="760" y="278" class="room-note">柴火灶｜水槽｜冰箱｜操作台</text>

  <text x="290.8" y="434" class="room-title">卫生间</text>
  <text x="290.8" y="458" class="room-note">2.36×2.6＝6.1㎡</text>
  <text x="395.8" y="424" class="room-note" transform="rotate(-90 395.8 424)">开放短廊 1.14m｜同堂屋做法</text>

  <text x="325" y="628" class="room-title">卧室 1（主卧）</text>
  <text x="325" y="655" class="room-note">3.5×4.87＝17.0㎡</text>
  <text x="325" y="678" class="room-note">南窗＋东窗</text>

  <text x="540" y="500" class="room-title">堂 屋</text>
  <text x="540" y="527" class="room-note">3.5×7.47＝26.2㎡</text>
  <text x="540" y="550" class="room-note">一次做通｜中间无隔断</text>

  <text x="760" y="378" class="room-title">客餐一体厅</text>
  <text x="760" y="403" class="room-note">4.0×4.32＝17.3㎡</text>
  
  <text x="760" y="555" class="room-note">北墙落地窗为唯一采光面</text>

  <text x="760" y="672" class="room-title">卧室 2</text>
  <text x="760" y="699" class="room-note">4.0×3.15＝12.6㎡</text>
  <text x="760" y="722" class="room-note">东窗＋北窗｜双面采光</text>

  <!-- 室外 -->
  <path d="M955 300 H895" class="dim" marker-end="url(#arrow)"/>
  <text x="962" y="282" class="outside">东侧家务院｜储柴、晾晒</text>
  <text x="962" y="307" class="outside">完整方正外墙，无房间凸出</text>
  <path d="M955 475 H895" class="dim" marker-end="url(#arrow)"/>
  <text x="962" y="470" class="outside">客餐厅北墙落地窗 2.33m</text>

  <!-- 尺寸 -->
  <path d="M190 130 V794 M182 130 H198 M182 794 H198" class="dim"/>
  <text x="162" y="462" class="dim-text" transform="rotate(-90 162 462)">东西约 11.058m</text>
  <path d="M220 858 H880 M220 850 V866 M430 850 V866 M640 850 V866 M880 850 V866" class="dim"/>
  <text x="325" y="846" class="dim-text">3.50</text>
  <text x="535" y="846" class="dim-text">3.50</text>
  <text x="760" y="846" class="dim-text">4.00</text>
  <path d="M220 890 H880 M220 882 V898 M880 882 V898" class="dim"/>
  <text x="550" y="881" class="dim-text">南北约 11.00m</text>
  <text x="550" y="920" class="outside" text-anchor="middle">东侧前院｜两车位</text>

  <!-- 方位 -->
  <g transform="translate(1080 165)">
    <circle cx="0" cy="0" r="58" fill="#ffffff" stroke="#9aa3b2" stroke-width="2"/>
    <path d="M0 35 V-35 M-35 0 H35" stroke="#596579" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="0" y="-44" class="legend" text-anchor="middle">西</text>
    <text x="0" y="55" class="legend" text-anchor="middle">东</text>
    <text x="-48" y="5" class="legend" text-anchor="middle">南</text>
    <text x="50" y="5" class="legend" text-anchor="middle">北</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(220 946)">
    <rect x="0" y="0" width="22" height="22" fill="#e8f0fe"/><text x="32" y="17" class="legend">卧室 1—4</text>
    <rect x="120" y="0" width="22" height="22" fill="#ffe6d9"/><text x="152" y="17" class="legend">厨房</text>
    <rect x="220" y="0" width="22" height="22" fill="#c3e3f5"/><text x="252" y="17" class="legend">卫生间湿区</text>
    <rect x="335" y="0" width="22" height="22" fill="#f4eadc"/><text x="367" y="17" class="legend">堂屋</text>
    <rect x="440" y="0" width="22" height="22" fill="#ffe9c7"/><text x="472" y="17" class="legend">客餐一体厅</text>
    <line x1="585" y1="11" x2="630" y2="11" class="window"/><text x="645" y="17" class="legend">外窗</text>
    <line x1="705" y1="3" x2="705" y2="20" class="partition"/><text x="723" y="17" class="legend">内隔墙</text>
    <rect x="865" y="0" width="22" height="22" fill="#f6ece0" stroke="#c9a877" stroke-width="2"/><text x="897" y="17" class="legend">床／衣柜／家具</text>
  </g>
</svg>
