<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="940" viewBox="0 0 1380 940">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5b6475; }
      .room-title { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .room-note { font-size: 13px; fill: #4b5565; text-anchor: middle; }
      .wall { stroke: #172033; stroke-width: 10; fill: none; stroke-linejoin: round; }
      .partition { stroke: #384152; stroke-width: 5; fill: none; }
      .soft-partition { stroke: #8b93a4; stroke-width: 3; stroke-dasharray: 10 8; fill: none; }
      .window { stroke: #2d9cdb; stroke-width: 9; stroke-linecap: round; }
      .door { stroke: #e15f41; stroke-width: 5; fill: none; }
      .dim { stroke: #788195; stroke-width: 2; fill: none; }
      .dim-text { font-size: 15px; fill: #687184; text-anchor: middle; }
      .outside { font-size: 15px; fill: #51606f; }
      .legend { font-size: 14px; fill: #465162; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#596579"/>
    </marker>
  </defs>

  <rect width="1380" height="940" fill="#f8fafc"/>
  <text x="60" y="55" class="title">民居第一版格局示意</text>
  <text x="60" y="84" class="subtitle">概念平面｜上西、右北、下东、左南｜主体约 14.3m × 8.5m｜非施工图</text>

  <!-- 房间底色 -->
  <rect x="140" y="150" width="245" height="252" fill="#e8f0fe"/>
  <rect x="140" y="402" width="245" height="84" fill="#f1f3f6"/>
  <rect x="140" y="486" width="245" height="259" fill="#fff0d2"/>

  <rect x="385" y="150" width="98" height="252" fill="#dff7f5"/>
  <rect x="483" y="150" width="228" height="252" fill="#e8f0fe"/>
  <rect x="711" y="150" width="227" height="252" fill="#e8f0fe"/>
  <rect x="938" y="150" width="203" height="252" fill="#edf2fb"/>

  <rect x="385" y="402" width="756" height="84" fill="#f1f3f6"/>

  <rect x="385" y="486" width="196" height="259" fill="#fff0d2"/>
  <rect x="581" y="486" width="245" height="259" fill="#ffe6d9"/>
  <rect x="826" y="486" width="154" height="259" fill="#f2eafe"/>
  <rect x="980" y="486" width="161" height="70" fill="#f1f3f6"/>
  <rect x="980" y="556" width="91" height="189" fill="#dff7f5"/>
  <rect x="1071" y="556" width="70" height="189" fill="#e2f2ff"/>

  <!-- 外墙与分隔墙 -->
  <rect x="140" y="150" width="1001" height="595" class="wall"/>
  <path d="M385 150 V402 M483 150 V402 M711 150 V402 M938 150 V402" class="partition"/>
  <path d="M140 402 H1141 M140 486 H1141" class="partition"/>
  <path d="M581 486 V745 M826 486 V745 M980 486 V745" class="partition"/>
  <path d="M980 556 H1141 M1071 556 V745" class="partition"/>
  <path d="M385 486 V745" class="soft-partition"/>

  <!-- 门洞与开启方向，白线覆盖墙体 -->
  <path d="M250 402 H305" stroke="#f1f3f6" stroke-width="12"/>
  <path d="M250 402 V347 A55 55 0 0 1 305 402" class="door"/>

  <path d="M415 402 H460" stroke="#f1f3f6" stroke-width="12"/>
  <path d="M415 402 V357 A45 45 0 0 1 460 402" class="door"/>
  <path d="M565 402 H615" stroke="#f1f3f6" stroke-width="12"/>
  <path d="M565 402 V352 A50 50 0 0 1 615 402" class="door"/>
  <path d="M790 402 H840" stroke="#f1f3f6" stroke-width="12"/>
  <path d="M790 402 V352 A50 50 0 0 1 840 402" class="door"/>
  <path d="M1000 402 H1050" stroke="#f1f3f6" stroke-width="12"/>
  <path d="M1000 402 V352 A50 50 0 0 1 1050 402" class="door"/>

  <path d="M640 486 H690" stroke="#ffe6d9" stroke-width="12"/>
  <path d="M640 486 V536 A50 50 0 0 0 690 486" class="door"/>
  <path d="M581 570 V625" stroke="#ffe6d9" stroke-width="12"/>
  <path d="M581 570 H636 A55 55 0 0 1 581 625" class="door"/>
  <path d="M875 486 H925" stroke="#f2eafe" stroke-width="12"/>
  <path d="M875 486 V536 A50 50 0 0 0 925 486" class="door"/>
  <path d="M1010 556 V606" stroke="#dff7f5" stroke-width="12"/>
  <path d="M1010 556 H1060 A50 50 0 0 1 1010 606" class="door"/>
  <path d="M1100 556 V606" stroke="#e2f2ff" stroke-width="12"/>
  <path d="M1100 556 H1140 A40 40 0 0 1 1100 596" class="door"/>

  <!-- 前门、后门 -->
  <path d="M275 745 H350" stroke="#f8fafc" stroke-width="14"/>
  <path d="M275 745 V670 A75 75 0 0 1 350 745" class="door"/>
  <text x="312" y="785" class="outside" text-anchor="middle">东侧前门</text>

  <path d="M1141 495 V545" stroke="#f8fafc" stroke-width="14"/>
  <path d="M1141 495 H1091 A50 50 0 0 1 1141 545" class="door"/>
  <text x="1170" y="515" class="outside">北侧家务后门</text>

  <!-- 外窗 -->
  <path d="M140 215 V300 M140 560 V665" class="window"/>
  <path d="M535 150 H650 M765 150 H880 M980 150 H1090 M410 150 H458" class="window"/>
  <path d="M175 745 H250 M420 745 H540 M625 745 H780 M855 745 H950 M995 745 H1055 M1090 745 H1125" class="window"/>

  <!-- 房间文字 -->
  <text x="262" y="250" class="room-title">老人房</text>
  <text x="262" y="276" class="room-note">南向｜1.5m床｜约11㎡净</text>
  <text x="262" y="446" class="room-title">过厅</text>
  <text x="262" y="616" class="room-title">客厅</text>
  <text x="262" y="642" class="room-note">南向大窗｜约13㎡分区</text>

  <text x="434" y="254" class="room-title">完整</text>
  <text x="434" y="280" class="room-title">公卫</text>
  <text x="434" y="306" class="room-note">淋浴＋蹲便</text>

  <text x="597" y="250" class="room-title">夫妻房 A</text>
  <text x="597" y="276" class="room-note">西向｜1.8m床</text>
  <text x="824" y="250" class="room-title">夫妻房 B</text>
  <text x="824" y="276" class="room-note">西向｜1.8m床</text>
  <text x="1039" y="250" class="room-title">成年人房</text>
  <text x="1039" y="276" class="room-note">西向｜1.5m床</text>

  <text x="760" y="451" class="room-title">1.2m 中央走廊</text>
  <text x="483" y="612" class="room-title">六人餐厅</text>
  <text x="483" y="638" class="room-note">与客厅开放连接</text>
  <text x="704" y="612" class="room-title">柴火厨房</text>
  <text x="704" y="638" class="room-note">双灶｜水槽｜冰箱｜排烟</text>
  <text x="903" y="612" class="room-title">多功能房</text>
  <text x="903" y="638" class="room-note">书房 → 儿童房</text>
  <text x="1060" y="527" class="room-note">家务前室</text>
  <text x="1025" y="636" class="room-title">简配</text>
  <text x="1025" y="662" class="room-title">公卫</text>
  <text x="1025" y="688" class="room-note">蹲便＋盆</text>
  <text x="1106" y="636" class="room-title" transform="rotate(-90 1106 636)">洗衣区</text>

  <!-- 玄关与外部功能 -->
  <rect x="295" y="670" width="70" height="48" rx="6" fill="#d8b68b" opacity="0.9"/>
  <text x="330" y="700" class="room-note">玄关柜</text>
  <path d="M315 812 V770" class="dim" marker-end="url(#arrow)"/>
  <text x="315" y="835" class="outside" text-anchor="middle">东侧前院｜两车位</text>
  <path d="M1210 610 H1155" class="dim" marker-end="url(#arrow)"/>
  <text x="1215" y="590" class="outside">有顶储柴区</text>
  <text x="1215" y="615" class="outside">室外晾晒区</text>

  <!-- 尺寸线 -->
  <path d="M140 120 H1141 M140 112 V128 M1141 112 V128" class="dim"/>
  <text x="640" y="112" class="dim-text">南北约 14.3m</text>
  <path d="M110 150 V745 M102 150 H118 M102 745 H118" class="dim"/>
  <text x="83" y="448" class="dim-text" transform="rotate(-90 83 448)">东西约 8.5m</text>

  <!-- 方位 -->
  <g transform="translate(1255 180)">
    <circle cx="0" cy="0" r="58" fill="#ffffff" stroke="#9aa3b2" stroke-width="2"/>
    <path d="M0 35 V-35 M-35 0 H35" stroke="#596579" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="0" y="-44" class="legend" text-anchor="middle">西</text>
    <text x="0" y="55" class="legend" text-anchor="middle">东</text>
    <text x="-48" y="5" class="legend" text-anchor="middle">南</text>
    <text x="50" y="5" class="legend" text-anchor="middle">北</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(140 855)">
    <rect x="0" y="0" width="22" height="22" fill="#e8f0fe"/><text x="32" y="17" class="legend">卧室</text>
    <rect x="105" y="0" width="22" height="22" fill="#fff0d2"/><text x="137" y="17" class="legend">客餐厅</text>
    <rect x="225" y="0" width="22" height="22" fill="#ffe6d9"/><text x="257" y="17" class="legend">厨房</text>
    <rect x="345" y="0" width="22" height="22" fill="#dff7f5"/><text x="377" y="17" class="legend">卫浴</text>
    <rect x="465" y="0" width="22" height="22" fill="#f2eafe"/><text x="497" y="17" class="legend">弹性空间</text>
    <line x1="620" y1="11" x2="665" y2="11" class="window"/><text x="680" y="17" class="legend">外窗</text>
    <text x="0" y="55" class="subtitle">注意：示意尺寸按功能分格表达，未计入准确墙厚与结构柱；施工前必须由专业设计人员复核。</text>
  </g>
</svg>
