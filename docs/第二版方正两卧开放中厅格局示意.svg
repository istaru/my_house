<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="980" viewBox="0 0 1380 980">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5b6475; }
      .room-title { font-size: 21px; font-weight: 700; text-anchor: middle; }
      .room-note { font-size: 13px; fill: #4b5565; text-anchor: middle; }
      .wall { stroke: #172033; stroke-width: 10; fill: none; stroke-linejoin: round; }
      .partition { stroke: #384152; stroke-width: 5; fill: none; }
      .soft { stroke: #8b93a4; stroke-width: 3; stroke-dasharray: 10 8; fill: none; }
      .window { stroke: #2d9cdb; stroke-width: 9; stroke-linecap: round; }
      .door { stroke: #e15f41; stroke-width: 5; fill: none; }
      .dim { stroke: #788195; stroke-width: 2; fill: none; }
      .dim-text { font-size: 15px; fill: #687184; text-anchor: middle; }
      .outside { font-size: 15px; fill: #51606f; }
      .legend { font-size: 14px; fill: #465162; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#596579"/>
    </marker>
  </defs>

  <rect width="1380" height="980" fill="#f8fafc"/>
  <text x="60" y="55" class="title">民居第二版｜方正两卧开放中厅</text>
  <text x="60" y="84" class="subtitle">概念平面｜上西、右北、下东、左南｜约 11.00m × 11.058m＝121.64㎡｜非施工图</text>

  <!-- 房间底色 -->
  <rect x="220" y="130" width="192" height="216" fill="#e8f0fe"/>
  <rect x="412" y="130" width="156" height="216" fill="#f2eafe"/>
  <rect x="568" y="130" width="144" height="216" fill="#fff0d2"/>
  <rect x="712" y="130" width="168" height="216" fill="#ffe6d9"/>

  <rect x="220" y="346" width="138" height="174" fill="#dff7f5"/>
  <rect x="358" y="346" width="54" height="174" fill="#f1f3f6"/>
  <rect x="220" y="520" width="192" height="274" fill="#e8f0fe"/>

  <rect x="412" y="346" width="468" height="144" fill="#fff5df"/>
  <rect x="412" y="490" width="156" height="304" fill="#f4eadc"/>
  <rect x="568" y="490" width="312" height="304" fill="#ffe9c7"/>

  <!-- 外墙与分隔 -->
  <rect x="220" y="130" width="660" height="664" class="wall"/>
  <path d="M412 130 V346 M568 130 V346 M712 130 V346" class="partition"/>
  <path d="M220 346 H365 M407 346 H412 M412 346 H568 M712 346 H880" class="partition"/>
  <path d="M220 520 H365 M407 520 H412 M358 346 V405 M358 450 V520 M412 520 V794" class="partition"/>
  <path d="M568 490 V794 M412 490 H880" class="soft"/>
  <path d="M568 346 H712" class="soft"/>

  <!-- 两卧室与卫生间共用开放短廊；三扇门均向房间内开 -->
  <path d="M365 346 H407" stroke="#e8f0fe" stroke-width="12"/>
  <path d="M365 346 V304 A42 42 0 0 1 407 346" class="door"/>
  <path d="M358 405 V450" stroke="#dff7f5" stroke-width="12"/>
  <path d="M358 450 H313 A45 45 0 0 1 358 405" class="door"/>
  <path d="M365 520 H407" stroke="#e8f0fe" stroke-width="12"/>
  <path d="M365 520 V562 A42 42 0 0 0 407 520" class="door"/>

  <!-- 书房、厨房 -->
  <path d="M470 346 H520" stroke="#fff5df" stroke-width="12"/>
  <path d="M470 346 V296 A50 50 0 0 1 520 346" class="door"/>
  <path d="M765 346 H815" stroke="#fff5df" stroke-width="12"/>
  <path d="M765 346 V296 A50 50 0 0 1 815 346" class="door"/>

  <!-- 正门与厨房后门 -->
  <path d="M470 794 H550" stroke="#f8fafc" stroke-width="14"/>
  <path d="M470 794 V714 A80 80 0 0 1 550 794" class="door"/>
  <text x="575" y="838" class="outside">东侧正门</text>
  <path d="M880 205 V270" stroke="#f8fafc" stroke-width="14"/>
  <path d="M880 205 H815 A65 65 0 0 1 880 270" class="door"/>
  <text x="913" y="230" class="outside">北侧厨房后门</text>

  <!-- 外窗 -->
  <path d="M220 190 V270 M220 385 V450 M220 590 V690" class="window"/>
  <path d="M450 130 H530 M600 130 H680 M755 130 H835" class="window"/>
  <path d="M880 390 V455 M880 565 V670" class="window"/>
  <path d="M270 794 H350 M605 794 H700 M745 794 H830" class="window"/>

  <!-- 房间标签 -->
  <text x="316" y="225" class="room-title">卧室 1</text>
  <text x="316" y="252" class="room-note">南向｜约11.5㎡分格</text>
  <text x="490" y="225" class="room-title">书房</text>
  <text x="490" y="252" class="room-note">西向｜约9.4㎡分格</text>
  <text x="640" y="225" class="room-title">六人餐厅</text>
  <text x="640" y="252" class="room-note">与客厅开放连接</text>
  <text x="796" y="225" class="room-title">柴火厨房</text>
  <text x="796" y="252" class="room-note">双灶｜水槽｜冰箱</text>

  <text x="289" y="411" class="room-title">卫生间</text>
  <text x="289" y="438" class="room-note">淋浴｜蹲便｜盆</text>
  <text x="289" y="465" class="room-note">洗衣机位</text>
  <text x="385" y="433" class="room-note" transform="rotate(-90 385 433)">开放短廊</text>
  <text x="316" y="645" class="room-title">卧室 2</text>
  <text x="316" y="672" class="room-note">南向＋东窗｜整墙衣柜</text>

  <text x="646" y="415" class="room-title">开放过厅</text>
  <text x="646" y="442" class="room-note">连接书房、餐厅、厨房和客厅</text>
  <text x="490" y="625" class="room-title">玄关</text>
  <text x="490" y="652" class="room-note">鞋柜｜换鞋凳｜入户屏风</text>
  <text x="724" y="625" class="room-title">开放客厅</text>
  <text x="724" y="652" class="room-note">参考图式大客厅｜东、北双向采光</text>
  <rect x="470" y="715" width="80" height="44" rx="6" fill="#d8b68b" opacity="0.9"/>
  <text x="510" y="742" class="room-note">玄关柜</text>

  <!-- 室外 -->
  <path d="M510 872 V818" class="dim" marker-end="url(#arrow)"/>
  <text x="510" y="897" class="outside" text-anchor="middle">东侧前院｜两车位</text>
  <path d="M955 310 H895" class="dim" marker-end="url(#arrow)"/>
  <text x="962" y="292" class="outside">北侧有顶储柴</text>
  <text x="962" y="317" class="outside">完整外墙，无房间凸出</text>

  <!-- 尺寸 -->
  <path d="M220 105 H880 M220 97 V113 M880 97 V113" class="dim"/>
  <text x="550" y="96" class="dim-text">南北约 11.00m</text>
  <path d="M190 130 V794 M182 130 H198 M182 794 H198" class="dim"/>
  <text x="162" y="462" class="dim-text" transform="rotate(-90 162 462)">东西约 11.058m</text>

  <!-- 方位 -->
  <g transform="translate(1060 165)">
    <circle cx="0" cy="0" r="58" fill="#ffffff" stroke="#9aa3b2" stroke-width="2"/>
    <path d="M0 35 V-35 M-35 0 H35" stroke="#596579" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="0" y="-44" class="legend" text-anchor="middle">西</text>
    <text x="0" y="55" class="legend" text-anchor="middle">东</text>
    <text x="-48" y="5" class="legend" text-anchor="middle">南</text>
    <text x="50" y="5" class="legend" text-anchor="middle">北</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(220 930)">
    <rect x="0" y="0" width="22" height="22" fill="#e8f0fe"/><text x="32" y="17" class="legend">卧室</text>
    <rect x="105" y="0" width="22" height="22" fill="#f2eafe"/><text x="137" y="17" class="legend">书房</text>
    <rect x="210" y="0" width="22" height="22" fill="#fff0d2"/><text x="242" y="17" class="legend">餐厅</text>
    <rect x="315" y="0" width="22" height="22" fill="#ffe6d9"/><text x="347" y="17" class="legend">厨房</text>
    <rect x="420" y="0" width="22" height="22" fill="#dff7f5"/><text x="452" y="17" class="legend">卫生间</text>
    <rect x="555" y="0" width="22" height="22" fill="#ffe9c7"/><text x="587" y="17" class="legend">客厅</text>
    <line x1="680" y1="11" x2="725" y2="11" class="window"/><text x="740" y="17" class="legend">外窗</text>
  </g>
</svg>
