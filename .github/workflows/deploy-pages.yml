name: 部署 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
