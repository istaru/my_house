<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>第一版 方正四卧等大格局示意</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #172033;
        background: #f4f6f8;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1440px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 40px;
      }

      header {
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(24px, 4vw, 36px);
      }

      p {
        margin: 0;
        color: #5b6475;
      }

      .sheet {
        overflow: auto;
        padding: 12px;
        background: #fff;
        border: 1px solid #dce1e8;
        border-radius: 12px;
        box-shadow: 0 8px 28px rgb(23 32 51 / 8%);
      }

      img {
        display: block;
        width: 100%;
        min-width: 900px;
        height: auto;
      }

      .links {
        margin-top: 14px;
        font-size: 14px;
      }

      a {
        color: #1769aa;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>第一版 方正四卧等大格局示意</h1>
        <p>概念平面图｜上西、右北、下东、左南｜约 121.64㎡｜四间卧室各 14.8㎡｜非施工图</p>
      </header>
      <section class="sheet" aria-label="住宅平面示意图">
        <img src="docs/第一版方正四卧等大格局示意.svg" alt="第一版方正四卧等大格局示意图">
      </section>
      <p class="links">

        ·
        <a href="docs/第一版方正四卧等大格局-建筑平面图.svg">建筑平面图（带轴网尺寸）</a>
        ·
        <a href="docs/历史-四卧堂屋格局示意.svg">历史图纸</a>
      </p>
    </main>

</html>
